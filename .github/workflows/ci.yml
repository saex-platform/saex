name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows ${{ matrix.architecture }} ${{ matrix.configuration }}
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, x86]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Toolchain
        shell: pwsh
        run: |
          dotnet --info
          cmake --version
          python --version
      - name: Build and test
        shell: pwsh
        env:
          SAEX_ARCHITECTURE: ${{ matrix.architecture }}
          SAEX_CONFIGURATION: ${{ matrix.configuration }}
        run: ./tools/build.ps1 -Architecture $env:SAEX_ARCHITECTURE -Configuration $env:SAEX_CONFIGURATION
      - name: Test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-${{ matrix.architecture }}-${{ matrix.configuration }}-logs
          path: |
            out/verification/docs-check.json
            out/windows-${{ matrix.architecture }}/Testing/Temporary/LastTest.log
          retention-days: 7
          if-no-files-found: error

  linux:
    name: Linux x64 Debug
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Native prerequisites
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Toolchain
        run: |
          dotnet --info
          cmake --version
          c++ --version
          python --version
      - name: Portable build and test
        run: python tools/ci.py linux
